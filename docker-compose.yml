services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reachlist
      POSTGRES_PASSWORD: reachlist
      POSTGRES_DB: reachlist
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachlist"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]

volumes:
  pgdata:
  redisdata:
